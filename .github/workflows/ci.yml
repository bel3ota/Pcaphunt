name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions: {}

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify CLI entry points
        run: |
          pcaphunt --version
          pcaphunt --help
          python -m pcaphunt --version
          python -m pcaphunt --help

      - name: Build package
        run: python -m build

      - name: Validate distribution
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install dist/*.whl
          /tmp/clean_venv/bin/pcaphunt --version
          /tmp/clean_venv/bin/pcaphunt --help
